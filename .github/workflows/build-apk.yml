name: Build & Download LeadX Pro APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Test, Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & required API 36.1 platform
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install compileSdk 36.1 + build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "$SDK_ROOT/licenses/intel-android-extra-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || sdkmanager --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or generate debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Web companion tests
        run: node --test website/website.test.mjs

      - name: Run Android unit tests & build Debug APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Verify APK integrity & prepare shareable APK files
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH was not generated"
            exit 1
          fi
          unzip -t "$APK_PATH" >/dev/null
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          fi
          cp "$APK_PATH" LeadX-Pro.apk
          cp "$APK_PATH" LeadX-Pro-debug.apk
          ls -lh LeadX-Pro.apk LeadX-Pro-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeadX-Pro-debug-apk
          path: |
            LeadX-Pro.apk
            LeadX-Pro-debug.apk
          retention-days: 30

      - name: Publish 1-click GitHub Release APK
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-apk"
          REPO="${{ github.repository }}"
          NOTES="Direct installable Android APK (LeadX-Pro.apk) built from commit ${GITHUB_SHA}. Download directly: https://github.com/${REPO}/releases/latest/download/LeadX-Pro.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LeadX-Pro.apk LeadX-Pro-debug.apk --clobber
            gh release edit "$TAG" --latest --title "LeadX Pro — Latest Android APK" --notes "$NOTES"
          else
            gh release create "$TAG" LeadX-Pro.apk LeadX-Pro-debug.apk \
              --target "${GITHUB_SHA}" \
              --latest \
              --title "LeadX Pro — Latest Android APK" \
              --notes "$NOTES"
          fi

      - name: Write Chrome & Shareable Download Guide to Summary
        if: always()
        run: |
          REPO="${{ github.repository }}"
          OWNER="$(echo "$REPO" | cut -d/ -f1)"
          NAME="$(echo "$REPO" | cut -d/ -f2)"
          {
            echo "## LeadX Pro APK — Public & Shareable Chrome Download"
            echo ""
            echo "### 1. Permanent Shareable Chrome Download Link (Always share THIS link)"
            echo "- Direct APK download: \`https://github.com/${REPO}/releases/latest/download/LeadX-Pro.apk\`"
            echo "- Releases page: \`https://github.com/${REPO}/releases/latest\`"
            echo "- Web & APK portal (when Pages is enabled): \`https://${OWNER}.github.io/${NAME}/\`"
            echo ""
            echo "### 2. Why another person couldn't download before (Important Checklist)"
            echo "1. **Repository visibility MUST be Public**: If \`${REPO}\` is **Private**, anyone else opening the link in Chrome gets a **404 / Sign in** error. Go to **Settings -> Danger Zone -> Change repository visibility -> Make public**."
            echo "2. **Never share Chrome's temporary \`release-assets.githubusercontent.com\` download URL or Actions Artifact \`.zip\` URL**: Chrome download URLs expire in minutes, and GitHub Actions Artifact links always require logging into GitHub and download a \`.zip\` instead of \`.apk\`."
            echo "3. **Always share \`LeadX-Pro.apk\` from Releases, or use the in-app \`Share Installable .apk File\` button**."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy Shareable Web & APK Portal (GitHub Pages)
    needs: build-apk
    if: success() && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: LeadX-Pro-debug-apk
          path: _apk_dist

      - name: Prepare static portal with LeadX-Pro.apk
        run: |
          mkdir -p _site
          cp -r website/. _site/
          cp _apk_dist/LeadX-Pro.apk _site/LeadX-Pro.apk
          cp _apk_dist/LeadX-Pro-debug.apk _site/LeadX-Pro-debug.apk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
